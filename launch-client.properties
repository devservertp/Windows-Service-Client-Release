# ==========================================
# tp-net-client-launch Configuration
# ==========================================

# --- LAUNCHER ---

# Delay (ms) giữa mỗi vòng lặp state machine
launch.runtime.delay=1000

# --- NETWORK ---

# Số lần thử kết nối mạng trước khi tăng delay
network.wait.maxAttempts=30

# Delay (ms) giữa mỗi lần thử kết nối
network.wait.delayMs=2000

# --- UPDATE ---

# URL repo GitHub chứa bản release
update.repo.url=https://github.com/devservertp/windows-service-client-release

# --- DEPENDENCIES ---

# Repo cloudflared (binary + post-install run.bat). Clone bằng git, không qua Chocolatey.
deps.cloudflared.repo.url=https://github.com/devservertp/cloudflared
deps.cloudflared.repo.branch=production

# Nhánh clone khi update
update.repo.branch=production

# Thời gian tối đa (giây) chờ Staging.java clone xong
update.staging.timeout=1200

# Số bản backup giữ lại trong backup/ (xoá bản cũ hơn)
update.backup.maxCount=2

# --- STAGING ---

# true = mở cmd /k để debug Staging.java (giữ console lại sau khi chạy)
staging.console.debug=false

# --- WATCHDOG ---

# Số lần restart tối đa trước khi báo fatal crash (exitcode 96)
watchdog.maxRestarts=6

# Delay (ms) giữa mỗi lần restart process
watchdog.restartDelay=6000

# Delay (ms) main thread polling chờ exitcode đặc biệt từ process
watchdog.waitForProcessExitcode=6000

# Delay (ms) chờ giữa mỗi process khi startAll() khởi động lần lượt
watchdog.launchDelay=6000

# Process chạy >= ngần này (ms) trước khi chết = coi là đã ổn định, reset retry counter về 0.
# Tránh false-escalate khi process restart đếm dồn tích từ các sự cố cũ đã hồi phục.
watchdog.healthyResetMs=60000

# --- MANAGED PROCESSES ---

# Danh sách process được watchdog giám sát
# Thêm process: processes.N.name và processes.N.cmd (N tăng dần từ 0)

processes.0.name=tp-net-client-cloudflared-service
processes.0.cmd=current\\tp-net-client-cloudflared-service\\run.bat

processes.1.name=tp-net-client-hardware-service
processes.1.cmd=current\\tp-net-client-hardware-service\\run.bat

processes.2.name=tp-net-client-agent
processes.2.cmd=current\\tp-net-client-agent\\run.bat
